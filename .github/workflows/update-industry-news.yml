name: Update industry news

on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-industry-news.mjs
      - name: Save refreshed intelligence
        run: |
          git config user.name "tradeflow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add github-pages/public/data/industry-news.json docs/data/industry-news.json
          git diff --cached --quiet || git commit -m "Update daily industry intelligence"
          git push
